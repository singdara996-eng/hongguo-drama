<!-- 8.2 release target. -->
<!DOCTYPE html>
<!-- 红果短剧 8.2：版本配置见 package.json，发行说明见 docs/release-8.2.md。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hongguo Short Drama</title>
    <script>
      // Web Browser Bridge for Google Chrome
      (function() {
        if (window.electronAPI) return;
        const noop = () => {};
        const listen = () => () => {};
        const pResolve = (val) => Promise.resolve(val);

        const categories = [
          { slug: 'real-drama', label: '真人剧' },
          { slug: 'comic-drama', label: '漫剧' },
          { slug: 'ai-drama', label: 'AI剧' },
          { slug: 'comic', label: '漫画' },
          { slug: 'hot-drama', label: '综合热播榜', group: 'rank' },
          { slug: 'hot-real-drama', label: '真人热播榜', group: 'rank' },
          { slug: 'hot-comic-drama', label: '漫剧热播榜', group: 'rank' },
          { slug: 'hot-ai-drama', label: 'AI 热播榜', group: 'rank' }
        ];

        const defaultGenres = [
          { slug: 'action', label: 'Action' },
          { slug: 'adventure', label: 'Adventure' },
          { slug: 'magic', label: 'Magic' },
          { slug: 'romance', label: 'Romance' },
          { slug: 'family', label: 'Family' },
          { slug: 'clan', label: 'Family saga' },
          { slug: 'cute-kids', label: 'Children' },
          { slug: 'suspense', label: 'Suspense' },
          { slug: 'supernatural', label: 'Supernatural tales' },
          { slug: 'period', label: 'Period' },
          { slug: 'fantasy', label: 'Fantasy' },
          { slug: 'wonder', label: 'Fantasy' },
          { slug: 'growth', label: 'Coming of age' },
          { slug: 'legend', label: 'Legends' },
          { slug: 'costume', label: 'Period stories' },
          { slug: 'urban', label: 'Urban' },
          { slug: 'youth', label: 'Youth' },
          { slug: 'comedy', label: 'Comedy' },
          { slug: 'sci-fi', label: 'Science fiction' },
          { slug: 'disaster', label: 'Disaster' },
          { slug: 'war', label: 'War' },
          { slug: 'variety', label: 'Variety shows' },
          { slug: 'drama', label: 'Drama' },
          { slug: 'comeback', label: 'Comeback' },
          { slug: 'thriller', label: 'Thriller' },
          { slug: 'horror', label: 'Horror' }
        ];

        const apiBase = '';

        const progressListeners = new Set();
        const completedListeners = new Set();
        const failedListeners = new Set();
        const queueChangedListeners = new Set();
        const taskAddedListeners = new Set();

        let lastTaskState = new Map();

        let currentEpisodes = [];
        let currentSeriesTitle = '';
        let currentSeriesId = '';
        let currentVidIndex = 1;
        const preloadedUrls = new Map();

        window.openWebPlayer = async function(seriesId, vidIndex = 1) {
          let modal = document.getElementById('web-player-modal');
          if (!modal) {
            modal = document.createElement('div');
            modal.id = 'web-player-modal';
            modal.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.88); z-index:9999999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; backdrop-filter:blur(10px); font-family:system-ui,-apple-system,sans-serif;';
            modal.innerHTML = `
              <div style="width:100%; max-width:880px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; color:#fff;">
                <div id="web-player-title" style="font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:12px;">កំពុងផ្ទុកវីដេអូ...</div>
                <button id="web-player-close" style="background:#27272a; border:1px solid #3f3f46; color:#fff; font-size:18px; width:36px; height:36px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s;">✕</button>
              </div>
              <div style="position:relative; width:100%; max-width:880px; background:#000; border-radius:12px; overflow:hidden; box-shadow:0 12px 48px rgba(0,0,0,0.9); display:flex; justify-content:center; align-items:center; aspect-ratio:16/9; max-height:70vh;">
                <video id="web-player-video" controls autoplay playsinline preload="auto" style="width:100%; height:100%; object-fit:contain; background:#000; outline:none;"></video>
                <div id="web-player-loading" style="position:absolute; color:#fff; font-size:15px; background:rgba(0,0,0,0.75); padding:10px 20px; border-radius:8px; display:none; pointer-events:none;">កំពុងទាញយកវីដេអូ...</div>
              </div>
              <div style="width:100%; max-width:880px; display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; flex-wrap:wrap;">
                <button id="web-player-prev" style="background:#27272a; border:1px solid #3f3f46; color:#fff; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13.5px;">‹ ភាគមុន (Prev)</button>
                <div style="display:flex; align-items:center; gap:8px;">
                  <label style="color:#a1a1aa; font-size:13px;">ជ្រើសភាគ:</label>
                  <select id="web-player-select" style="background:#18181b; border:1px solid #3f3f46; color:#fff; padding:6px 12px; border-radius:6px; font-size:13.5px; outline:none; cursor:pointer; max-width:200px;"></select>
                </div>
                <!-- Playback Speed Controls -->
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="color:#a1a1aa; font-size:13px;">ល្បឿន:</span>
                  <div id="web-player-speeds" style="display:flex; gap:3px; background:#18181b; padding:2px; border-radius:6px; border:1px solid #3f3f46;">
                    <button type="button" data-speed="1" class="web-speed-btn" style="background:#c8383d; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;">1x</button>
                    <button type="button" data-speed="1.25" class="web-speed-btn" style="background:transparent; color:#d4d4d8; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;">1.25x</button>
                    <button type="button" data-speed="1.5" class="web-speed-btn" style="background:transparent; color:#d4d4d8; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;">1.5x</button>
                    <button type="button" data-speed="2" class="web-speed-btn" style="background:transparent; color:#d4d4d8; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;">2x</button>
                  </div>
                </div>
                <button id="web-player-next" style="background:#c8383d; border:none; color:#fff; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13.5px; font-weight:600;">ភាគបន្ទាប់ (Next) ›</button>
              </div>
            `;
            document.body.appendChild(modal);

            const speedBtns = modal.querySelectorAll('.web-speed-btn');
            function updateActiveSpeedBtn(val) {
              speedBtns.forEach(b => {
                if (parseFloat(b.dataset.speed) === val) {
                  b.style.background = '#c8383d';
                  b.style.color = '#fff';
                } else {
                  b.style.background = 'transparent';
                  b.style.color = '#d4d4d8';
                }
              });
            }
            speedBtns.forEach(btn => {
              btn.onclick = () => {
                const speed = parseFloat(btn.dataset.speed) || 1;
                const vid = document.getElementById('web-player-video');
                if (vid) vid.playbackRate = speed;
                localStorage.setItem('web_player_speed', String(speed));
                updateActiveSpeedBtn(speed);
              };
            });
            const savedSpeed = parseFloat(localStorage.getItem('web_player_speed')) || 1;
            updateActiveSpeedBtn(savedSpeed);

            document.getElementById('web-player-close').onclick = () => {
              const vid = document.getElementById('web-player-video');
              if (vid) { vid.pause(); vid.src = ''; }
              modal.style.display = 'none';
            };

            document.getElementById('web-player-prev').onclick = () => {
              if (currentVidIndex > 1) window.playEpisodeByIndex(currentVidIndex - 1);
            };

            document.getElementById('web-player-next').onclick = () => {
              if (currentVidIndex < currentEpisodes.length) window.playEpisodeByIndex(currentVidIndex + 1);
            };

            document.getElementById('web-player-select').onchange = (e) => {
              window.playEpisodeByIndex(parseInt(e.target.value, 10));
            };

            const videoEl = document.getElementById('web-player-video');
            videoEl.onended = () => {
              if (currentVidIndex < currentEpisodes.length) {
                window.playEpisodeByIndex(currentVidIndex + 1);
              }
            };

            document.addEventListener('keydown', (e) => {
              if (modal.style.display === 'none') return;
              const vid = document.getElementById('web-player-video');
              if (!vid) return;

              if (e.key === 'Escape') {
                vid.pause(); vid.src = '';
                modal.style.display = 'none';
              } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                vid.currentTime = Math.min((vid.duration || 0), vid.currentTime + 5);
              } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                vid.currentTime = Math.max(0, vid.currentTime - 5);
              } else if (e.key === ' ') {
                e.preventDefault();
                if (vid.paused) vid.play(); else vid.pause();
              }
            });
          }

          modal.style.display = 'flex';
          const loadingEl = document.getElementById('web-player-loading');
          loadingEl.style.display = 'block';
          loadingEl.textContent = 'កំពុងទាញយកព័ត៌មានរឿង...';

          try {
            const res = await fetch(`${apiBase}/api/series/${encodeURIComponent(seriesId)}`);
            const data = await res.json();
            const series = data.series || {};
            currentSeriesId = String(seriesId);
            currentSeriesTitle = series.series_title || 'ទស្សនារឿង';
            currentEpisodes = Array.isArray(series.episodes) ? series.episodes : [];

            const select = document.getElementById('web-player-select');
            select.innerHTML = '';
            currentEpisodes.forEach(ep => {
              const opt = document.createElement('option');
              opt.value = ep.vid_index;
              opt.textContent = `ភាគ ${ep.vid_index}${ep.title ? ' - ' + ep.title : ''}`;
              select.appendChild(opt);
            });

            window.playEpisodeByIndex(vidIndex);
          } catch (err) {
            loadingEl.textContent = 'បរាជ័យក្នុងការទាញយកភាគ: ' + err.message;
          }
        };

        window.playEpisodeByIndex = function(index) {
          currentVidIndex = index;
          const ep = currentEpisodes.find(e => e.vid_index === index) || currentEpisodes[index - 1];
          if (!ep) return;

          const titleEl = document.getElementById('web-player-title');
          titleEl.textContent = `《${currentSeriesTitle}》 - ភាគទី ${index}`;

          const select = document.getElementById('web-player-select');
          if (select) select.value = String(index);

          const prevBtn = document.getElementById('web-player-prev');
          if (prevBtn) prevBtn.disabled = (index <= 1);

          const nextBtn = document.getElementById('web-player-next');
          if (nextBtn) nextBtn.disabled = (index >= currentEpisodes.length);

          const videoEl = document.getElementById('web-player-video');
          const loadingEl = document.getElementById('web-player-loading');
          loadingEl.style.display = 'block';
          loadingEl.textContent = `កំពុងភ្ជាប់ភាគ ${index}...`;

          const currentSpeed = parseFloat(localStorage.getItem('web_player_speed')) || 1;

          videoEl.onplaying = () => {
            loadingEl.style.display = 'none';
            videoEl.playbackRate = currentSpeed;
          };
          videoEl.onerror = () => {
            loadingEl.style.display = 'block';
            loadingEl.textContent = 'បរាជ័យក្នុងការចាក់វីដេអូភាគនេះ';
          };

          // Check if direct preloaded URL exists for instant playback
          const preloaded = preloadedUrls.get(ep.vid);
          if (preloaded) {
            videoEl.src = preloaded;
            videoEl.load();
            videoEl.play().catch(() => {});
          } else {
            // Fetch direct CDN stream URL for ultra-fast direct streaming
            fetch(`${apiBase}/api/stream-url/${encodeURIComponent(currentSeriesId)}/${encodeURIComponent(ep.vid)}`)
              .then(r => r.json())
              .then(data => {
                if (currentVidIndex === index && data?.url) {
                  videoEl.src = data.url;
                  videoEl.load();
                  videoEl.play().catch(() => {});
                }
              })
              .catch(() => {
                if (currentVidIndex === index) {
                  videoEl.src = `${apiBase}/api/stream/${encodeURIComponent(currentSeriesId)}/${encodeURIComponent(ep.vid)}`;
                  videoEl.load();
                  videoEl.play().catch(() => {});
                }
              });
          }

          // Preload next episode in background for instant transition
          const nextEp = currentEpisodes.find(e => e.vid_index === index + 1);
          if (nextEp && !preloadedUrls.has(nextEp.vid)) {
            fetch(`${apiBase}/api/stream-url/${encodeURIComponent(currentSeriesId)}/${encodeURIComponent(nextEp.vid)}`)
              .then(r => r.json())
              .then(data => {
                if (data?.url) preloadedUrls.set(nextEp.vid, data.url);
              })
              .catch(() => {});
          }
        };

        // Real-time task progress poller
        setInterval(async () => {
          try {
            const res = await fetch(`${apiBase}/api/tasks`);
            const data = await res.json();
            const tasks = data.tasks || [];
            let queueChanged = false;

            for (const task of tasks) {
              const prev = lastTaskState.get(task.id);
              if (!prev) {
                queueChanged = true;
                taskAddedListeners.forEach(cb => { try { cb(task); } catch(_) {} });
              } else {
                if (task.status === 'running' || task.progress !== prev.progress) {
                  progressListeners.forEach(cb => {
                    try {
                      cb({
                        id: task.id,
                        progress: task.progress || 0,
                        receivedBytes: 0,
                        totalBytes: 0
                      });
                    } catch(_) {}
                  });
                }
                if (task.status === 'completed' && prev.status !== 'completed') {
                  queueChanged = true;
                  completedListeners.forEach(cb => { try { cb(task); } catch(_) {} });
                }
                if (task.status === 'failed' && prev.status !== 'failed') {
                  queueChanged = true;
                  failedListeners.forEach(cb => { try { cb(task); } catch(_) {} });
                }
              }
              lastTaskState.set(task.id, { ...task });
            }

            if (queueChanged) {
              queueChangedListeners.forEach(cb => { try { cb(); } catch(_) {} });
            }
          } catch (_) {}
        }, 600);

        window.electronAPI = new Proxy({
          platform: 'browser',
          getAppInfo: () => pResolve({
            version: '8.2.0',
            appName: 'Hongguo Short Drama',
            brand: 'Hongguo Drama',
            systemLocale: 'km',
            locale: 'km'
          }),
          getWindowLayout: () => pResolve({ width: window.innerWidth, height: window.innerHeight, layout: 'landscape' }),
          setWindowLayout: (mode) => pResolve({ success: true, mode }),
          getAlwaysOnTop: () => pResolve(false),
          setAlwaysOnTop: () => pResolve(false),
          setStealthMode: () => pResolve({ success: true }),
          getMediaSources: () => pResolve({ success: true, sources: [
            { id: 'hongguo', label: '红果短剧', enabled: true },
            { id: 'xifan', label: '西番短剧', enabled: true },
            { id: 'hema', label: '河马短剧', enabled: true }
          ] }),
          getCustomSources: () => pResolve([]),
          getSettings: () => pResolve({
            root: 'C:\\Users\\SH\\Downloads',
            downloadPath: 'C:\\Users\\SH\\Downloads',
            name_format: '剧名 集数',
            max_concurrent: 3,
            ui_zoom: 1,
            download_quality: 'auto',
            download_metadata: false,
            custom_sources: [],
            builtin_sources: { hongguo: true, xifan: true, hema: true, reelshort: false, dramabox: false },
            auto_delete_watched: false,
            compat_mode: true,
            fast_conversion: false,
            cache_next_episode: true,
            picture_in_picture_mode: 'custom',
            app_updates_enabled: false,
            watch_updates_enabled: true,
            watch_sequels_enabled: true,
            watch_notifications_enabled: false,
            search_app_enabled: false,
            language: 'km'
          }),
          saveSettings: () => pResolve({ success: true }),
          getSeriesList: () => pResolve([]),
          getSeriesProgress: () => pResolve({ success: true, progress: {} }),
          warmSeriesProgress: () => pResolve({ success: true, progress: 0 }),
          getWatchHistory: () => pResolve([]),
          refreshWatchHistory: () => pResolve([]),
          getDownloadTasks: async () => {
            try {
              const res = await fetch(`${apiBase}/api/tasks`);
              const data = await res.json();
              return (data.tasks || []).map(task => ({
                ...task,
                status: task.status === 'running' ? 'downloading' : task.status === 'queued' ? 'pending' : task.status,
                title: `${task.seriesTitle || '短剧'} 第${task.episodeIndex || 1}集`,
                filename: `${task.seriesTitle || '短剧'}_第${String(task.episodeIndex || 1).padStart(2, '0')}集.mp4`,
                progress: task.progress || 0,
                videoInfo: {
                  cover: task.cover ? (task.cover.startsWith('http') && !task.cover.includes('proxy-image') ? (`${apiBase}/api/proxy-image?url=` + encodeURIComponent(task.cover)) : (task.cover.startsWith('/api') ? `${apiBase}${task.cover}` : task.cover)) : ''
                }
              }));
            } catch {
              return [];
            }
          },
          getMergeTasks: () => pResolve([]),
          getQueueStatus: async () => {
            try {
              const res = await fetch(`${apiBase}/api/tasks`);
              const data = await res.json();
              const tasks = data.tasks || [];
              return {
                running: tasks.filter(t => t.status === 'running').length,
                queued: tasks.filter(t => t.status === 'queued').length
              };
            } catch {
              return { running: 0, queued: 0 };
            }
          },
          onDownloadProgress: (cb) => { progressListeners.add(cb); return () => progressListeners.delete(cb); },
          onDownloadCompleted: (cb) => { completedListeners.add(cb); return () => completedListeners.delete(cb); },
          onDownloadFailed: (cb) => { failedListeners.add(cb); return () => failedListeners.delete(cb); },
          onDownloadStopped: () => () => {},
          onDownloadQueueChanged: (cb) => { queueChangedListeners.add(cb); return () => queueChangedListeners.delete(cb); },
          onDownloadTaskAdded: (cb) => { taskAddedListeners.add(cb); return () => taskAddedListeners.delete(cb); },
          browseCategories: () => pResolve(categories),
          browseList: async (options) => {
            const cat = options?.category || 'real-drama';
            const gen = options?.genre || '';
            const pg = options?.page || 1;
            const channel = options?.catalogChannel || 'web';
            try {
              const res = await fetch(`${apiBase}/api/browse-list?category=${encodeURIComponent(cat)}&genre=${encodeURIComponent(gen)}&page=${pg}&catalogChannel=${channel}`);
              const data = await res.json();
              return {
                success: true,
                results: (data.results || []).map(item => ({
                  ...item,
                  cover: item.cover ? (item.cover.startsWith('http') && !item.cover.includes('proxy-image') ? (`${apiBase}/api/proxy-image?url=` + encodeURIComponent(item.cover)) : (item.cover.startsWith('/api') ? `${apiBase}${item.cover}` : item.cover)) : ''
                })),
                total: data.total || (data.results || []).length,
                totalPages: typeof data.totalPages === 'number' ? data.totalPages : 0,
                genres: (cat === 'comic') ? [] : (data.genres !== undefined ? data.genres : defaultGenres),
                page: data.page || pg,
                hasMore: data.hasMore !== undefined ? Boolean(data.hasMore) : ((data.results || []).length >= 8)
              };
            } catch (err) {
              console.error('browseList error:', err);
              return { success: true, results: [], total: 0, totalPages: 0, genres: (cat === 'comic') ? [] : defaultGenres };
            }
          },
          searchSeries: async (query, options) => {
            const pg = (typeof options === 'object' ? options?.page : options) || 1;
            try {
              const res = await fetch(`${apiBase}/api/search?q=${encodeURIComponent(query)}&page=${pg}`);
              const data = await res.json();
              const results = (data.results || []).map(item => ({
                ...item,
                cover: item.cover ? (item.cover.startsWith('http') && !item.cover.includes('proxy-image') ? (`${apiBase}/api/proxy-image?url=` + encodeURIComponent(item.cover)) : (item.cover.startsWith('/api') ? `${apiBase}${item.cover}` : item.cover)) : ''
              }));
              return { success: true, results, page: data.page || pg, hasMore: Boolean(data.hasMore) };
            } catch {
              return { success: true, results: [], page: 1, hasMore: false };
            }
          },
          searchSeriesMore: async (query, options) => {
            const pg = (typeof options === 'object' ? options?.page : options) || 2;
            try {
              const res = await fetch(`${apiBase}/api/search?q=${encodeURIComponent(query)}&page=${pg}`);
              const data = await res.json();
              const results = (data.results || []).map(item => ({
                ...item,
                cover: item.cover ? (item.cover.startsWith('http') && !item.cover.includes('proxy-image') ? (`${apiBase}/api/proxy-image?url=` + encodeURIComponent(item.cover)) : (item.cover.startsWith('/api') ? `${apiBase}${item.cover}` : item.cover)) : ''
              }));
              return { success: true, results, page: data.page || pg, hasMore: Boolean(data.hasMore) };
            } catch {
              return { success: false, results: [], page: pg, hasMore: false };
            }
          },
          searchResolve: async (seriesId) => {
            try {
              const res = await fetch(`${apiBase}/api/series/` + encodeURIComponent(seriesId));
              const data = await res.json();
              return { success: true, data: data.series || {} };
            } catch (err) {
              return { success: false, error: String(err) };
            }
          },
          getSeriesEpisodes: async (id) => {
            try {
              const res = await fetch(`${apiBase}/api/series/` + encodeURIComponent(id));
              const data = await res.json();
              return { success: true, data: data.series || { episodes: [] } };
            } catch (err) {
              return { success: false, error: String(err) };
            }
          },
          getPublicDetails: async (id) => {
            try {
              const res = await fetch(`${apiBase}/api/series/` + encodeURIComponent(id));
              const data = await res.json();
              return { success: true, data: data.series || {} };
            } catch (err) {
              return { success: false, error: String(err) };
            }
          },
          playSeries: (payload) => {
            console.log('Play series:', payload);
            if (payload && payload.seriesId) {
              try {
                window.openWebPlayer(payload.seriesId, payload.vidIndex || 1);
              } catch (e) {
                console.error('Error opening player:', e);
              }
            }
            return pResolve({ success: true });
          },
          hongguoDownloadBatch: async (payload) => {
            try {
              const body = {
                seriesId: String(payload.seriesId),
                episodeIds: (payload.episodeIds || (payload.episodes || []).map(e => String(e.vid))),
                quality: payload.quality || 'auto'
              };
              const res = await fetch(`${apiBase}/api/downloads`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
              });
              const data = await res.json();
              return {
                success: data.success,
                count: body.episodeIds.length,
